spring.application.name=backend

# =========================
# Database Configuration
# =========================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:music_catalog}
spring.datasource.username=${POSTGRES_USER:music_user}
spring.datasource.password=${POSTGRES_PASSWORD:music_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable Open Session in View (recommended)
spring.jpa.open-in-view=false

# =========================
# JWT Configuration
# =========================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# =========================
# Google Gemini
# =========================
google.api.key=${GOOGLE_API_KEY:}
google.ai.model=gemini-3.1-flash-lite

# =========================
# Logging
# =========================
logging.level.org.springframework.security=TRACE
