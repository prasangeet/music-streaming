version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: music-catalog-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: music_catalog
      POSTGRES_USER: music_user
      POSTGRES_PASSWORD: password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U music_user -d music_catalog"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - music-catalog-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: music-catalog-backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - ./backend/.env

    environment:
      DB_HOST: postgres
      DB_PORT: 5432

    ports:
      - "8080:8080"

    networks:
      - music-catalog-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: music-catalog-frontend
    restart: unless-stopped

    depends_on:
      - backend

    environment:
      NEXT_PUBLIC_API_URL: http://backend:8080/api

    ports:
      - "3000:3000"

    networks:
      - music-catalog-network

volumes:
  postgres_data:

networks:
  music-catalog-network:
    driver: bridge
